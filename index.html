         cropped face identical to the profile photo already on the page. -->

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rodrigo Pimenta — I write software that keeps distributed systems alive. Platform, infrastructure, backend, SRE." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rodrigo Pimenta — Systems Engineer" />

    <meta name="twitter:image" content="https://rodrigopimenta.com/images/og-card.png" />

    <title>Rodrigo Pimenta — Systems Engineer</title>
