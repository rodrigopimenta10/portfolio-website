# Checks for the Terraform in infra/. Nothing here signs in to Google Cloud, reads the state or
# needs a secret: validate and test run against mocked providers (infra/tests/).
# Applying is done by hand (infra/README.md), never from a workflow.
name: infra

on:
  pull_request:
    paths: [infra/**, .github/workflows/infra.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.2

      - name: Format
        run: terraform fmt -check -recursive

      - name: Providers (no backend, so no state and no credentials)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Tests (mocked providers, nothing created)
        run: terraform test
