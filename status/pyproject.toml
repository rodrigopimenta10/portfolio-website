[project]
name = "portfolio-status"
version = "0.1.0"
description = "Reports the live state of the systems Rodrigo Pimenta runs, for rodrigopimenta.com"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.164,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_status"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Starlette 1.10 prefers a package named httpx2 for its test client. The service itself uses httpx, and
    # one HTTP client is enough, so the test client stays on it for now.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
